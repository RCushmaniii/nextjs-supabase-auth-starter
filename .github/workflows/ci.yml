name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
